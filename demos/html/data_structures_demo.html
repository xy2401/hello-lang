<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 树形数据结构</title>
</head>
<body>
  <main>
    <h1>课程目录</h1>
    <ol>
      <li>语法</li>
      <li>数据结构
        <ul>
          <li data-kind="linear">线性结构</li>
          <li data-kind="tree">树结构</li>
        </ul>
      </li>
    </ol>
    <table>
      <caption>学习进度</caption>
      <thead><tr><th scope="col">主题</th><th scope="col">状态</th></tr></thead>
      <tbody><tr><th scope="row">树</th><td>进行中</td></tr></tbody>
    </table>
  </main>
</body>
</html>
